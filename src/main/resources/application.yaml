spring:
  application:
    name: pulsepass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    springdoc:
      swagger-ui:
        path: /swagger-ui.html

    pulsepass:
      security:
        jwt:
          issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
          secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
          access-token-ttl: PT15Mnutos en segundos